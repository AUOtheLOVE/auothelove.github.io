<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>도구 모음</title>
<meta name="description" content="드롭 테이블 메이커 · 소분을 하자 · 복주머니 · 구매 요청 보드. 브라우저 안에서만 도는 작은 도구들."/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="도구 모음"/>
<meta property="og:title" content="도구 모음"/>
<meta property="og:description" content="브라우저 안에서만 도는 작은 도구들. 필요한 것만 골라 쓰세요."/>
<meta name="twitter:card" content="summary"/>
<meta name="theme-color" content="#faf8f4"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --paper:#faf8f4;
  --card:#ffffff;
  --ink:#17140f;
  --muted:#7a736a;
  --faint:#b4ada3;
  --line:#e7e2d9;
  --line-soft:#efebe3;
  --gold:#8a6d1f;
  --gold-ink:#6f5716;
  --gold-soft:#f2ead6;
  --hover:#faf7f0;
}

html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
  padding:72px 20px 56px;min-height:100vh;
}
.shell{width:100%;max-width:544px}

/* ── 머리 ── */
.eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:.22em;
  color:var(--gold);text-transform:uppercase;margin-bottom:11px;
}
h1{
  font-size:31px;font-weight:700;letter-spacing:-.028em;line-height:1.2;
}
.lede{
  color:var(--muted);font-size:13.5px;line-height:1.7;
  margin-top:9px;max-width:34em;
}
.rule{
  height:1px;background:linear-gradient(90deg,var(--gold) 0%,var(--line) 38%,transparent 100%);
  margin:26px 0 34px;
}

/* ── 구획 ── */
section+section{margin-top:32px}
.shead{
  display:flex;align-items:baseline;gap:11px;margin:0 0 11px 2px;
}
.shead h2{
  font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink);
}
.shead .cnt{font-size:11px;color:var(--faint);letter-spacing:.06em}
.shead .fill{flex:1;height:1px;background:var(--line-soft)}

/* ── 목록 ── */
.list{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
}
a.row{
  display:flex;align-items:center;gap:14px;
  padding:15px 17px;
  text-decoration:none;color:inherit;
  position:relative;
  transition:background .15s ease;
}
a.row+a.row{border-top:1px solid var(--line-soft)}
a.row:hover{background:var(--hover)}
a.row:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:2px}

.ic{
  flex:0 0 40px;width:40px;height:40px;border-radius:11px;
  background:var(--gold-soft);color:var(--gold-ink);
  display:flex;align-items:center;justify-content:center;
  transition:background .15s ease,color .15s ease;
}
.ic svg{width:21px;height:21px;display:block}
a.row:hover .ic{background:var(--gold);color:#fff}

.tx{flex:1;min-width:0}
.nm,.ds{display:block}
.nm{
  font-size:15px;font-weight:600;letter-spacing:-.012em;line-height:1.35;
}
.ds{
  font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px;
}
.go{
  flex:0 0 auto;color:var(--faint);font-size:15px;line-height:1;
  transition:transform .18s ease,color .15s ease;
}
a.row:hover .go{color:var(--gold);transform:translateX(3px)}

/* ── 발 ── */
footer{
  margin-top:34px;padding-top:17px;border-top:1px solid var(--line-soft);
  color:var(--faint);font-size:11.5px;line-height:1.85;
}
footer b{color:var(--muted);font-weight:600}

@media (max-width:520px){
  body{padding:44px 16px 40px}
  h1{font-size:26px}
  .rule{margin:22px 0 28px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="eyebrow">Tools</div>
    <h1>도구 모음</h1>
    <p class="lede">브라우저 안에서만 도는 작은 도구들. 필요한 것만 골라 쓰세요.</p>
  </header>
  <div class="rule"></div>

  <!-- ══ 내 도구 ═══════════════════════════════════════════════
       항목을 추가하려면 <a class="row"> 한 덩이를 통째로 복사한 뒤
       href · 아이콘 svg · .nm(이름) · .ds(설명) 만 바꾸면 됩니다.
  ══════════════════════════════════════════════════════════ -->
  <section>
    <!-- 나중에 구획을 나누고 싶으면 <div class="list"> 위에 이 한 줄을 넣으면 됩니다.
         <div class="shead"><h2>구획 이름</h2><span class="cnt">3</span><span class="fill"></span></div> -->
    <div class="list">

      <a class="row" href="drop.html">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.2"/><circle cx="8.6" cy="8.6" r="1.25" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.25" fill="currentColor" stroke="none"/></svg></span>
        <span class="tx">
          <span class="nm">드롭 테이블 메이커</span>
          <span class="ds">확률표를 만들고 직접 굴려 봅니다</span>
        </span>
        <span class="go" aria-hidden="true">→</span>
      </a>

      <a class="row" href="goods.html">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="3.5" width="7.4" height="7.4" rx="1.8" fill="currentColor" stroke="none" opacity=".92"/><rect x="13.1" y="3.5" width="7.4" height="7.4" rx="1.8"/><rect x="3.5" y="13.1" width="7.4" height="7.4" rx="1.8"/><rect x="13.1" y="13.1" width="7.4" height="7.4" rx="1.8" fill="currentColor" stroke="none" opacity=".92"/></svg></span>
        <span class="tx">
          <span class="nm">소분을 하자</span>
          <span class="ds">굿즈 이미지에 남은 자리를 표시합니다</span>
        </span>
        <span class="go" aria-hidden="true">→</span>
      </a>

      <a class="row" href="gacha.html">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.1v3.1M14.5 3.1v3.1"/><path d="M8.3 6.2h7.4"/><path d="M15.5 6.2c2.4 1.9 4 4.7 4 7.7A7.5 7.5 0 0 1 12 21a7.5 7.5 0 0 1-7.5-7.1c0-3 1.6-5.8 4-7.7"/></svg></span>
        <span class="tx">
          <span class="nm">복주머니</span>
          <span class="ds">2026 여름 축제 기념 확챠 플래너</span>
        </span>
        <span class="go" aria-hidden="true">→</span>
      </a>

      <a class="row" href="product-board.html">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.4" y="5.2" width="15.2" height="15.3" rx="2.6"/><path d="M9.1 5.2V4.1c0-.7.6-1.3 1.3-1.3h3.2c.7 0 1.3.6 1.3 1.3v1.1"/><path d="m8.9 13.1 2.3 2.3 4.1-4.4"/></svg></span>
        <span class="tx">
          <span class="nm">구매 요청 보드</span>
          <span class="ds">상품을 모아 체크하고 PNG 한 장으로 넘깁니다</span>
        </span>
        <span class="go" aria-hidden="true">→</span>
      </a>

    </div>
  </section>

  <footer>
    모든 도구는 <b>브라우저 안에서만</b> 돌아갑니다. 입력한 내용은 서버로 올라가지 않습니다.<br/>
    브라우저 데이터를 지우면 저장한 내용도 함께 사라집니다.
  </footer>

</div>
</body>
</html>
