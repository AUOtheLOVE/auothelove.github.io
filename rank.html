<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>순위 매기기</title>
<meta name="theme-color" content="#f7f5f0"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}   /* display:flex 가 UA의 [hidden] 을 이겨서 생기는 겹침 방지 */

:root{
  --bg:   #f7f5f0;
  --s1:   #ffffff;
  --s2:   #f0ede8;
  --s3:   #e8e4de;
  --line: #ddd9d2;
  --t1:   #1a1814;
  --t2:   #6b6660;
  --t3:   #aaa49e;
  --acc:  #9a7c2e;
  --acc2: #7a5e1e;
}

html,body{height:100%}
body{
  background:var(--bg);color:var(--t1);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  overscroll-behavior:none;
}

/* ── 상단바 ── */
.topbar{
  background:var(--s1);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;
  flex-wrap:wrap;
}
.topbar h1{font-size:14px;font-weight:600;color:var(--t1);letter-spacing:.02em}
.topbar h1 span{color:var(--acc)}

.btn{
  background:var(--s2);color:var(--t1);
  border:1px solid var(--line);border-radius:4px;
  padding:5px 12px;font-size:12px;line-height:17px;cursor:pointer;
  white-space:nowrap;transition:background .1s,border-color .1s;
}
.btn:hover{background:var(--s3);border-color:var(--t3)}
a.btn{display:inline-block;text-decoration:none;vertical-align:middle}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:var(--s2);border-color:var(--line)}
.btn.save{border-color:var(--acc);color:var(--acc)}
.btn.save:hover:not(:disabled){background:var(--acc);color:#fff}
.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.on:hover:not(:disabled){background:var(--acc2);border-color:var(--acc2)}
.seg{display:inline-flex;gap:0}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:4px 0 0 4px;margin-left:0}
.seg .btn:last-child{border-radius:0 4px 4px 0}

/* ── 무대 ── */
.scroll{
  flex:1;overflow:auto;padding:12px 14px 16px;
  display:flex;justify-content:center;align-items:flex-start;
}

#stage{
  position:relative;width:100%;max-width:720px;
  background:var(--s1);border:1px solid var(--line);border-radius:6px;
  overflow:hidden;
}
#stage.drop-hot{border-color:var(--acc);box-shadow:0 0 0 3px rgba(154,124,46,.18)}

/* 배경 이미지 */
#bgImg{display:block;width:100%;height:auto}
/* 가로로 넓은 그림은 세로 액자에 통째로 넣는다 (10칸이 들어가야 하므로) */
#stage.short{aspect-ratio:5/6;background:#20242b}
#stage.short #bgImg{width:100%;height:100%;object-fit:contain}

#bgEmpty{
  cursor:pointer;
  aspect-ratio:3/4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;
  color:var(--t3);font-size:13px;text-align:center;padding:24px 24px 24px 22%;
  background:repeating-linear-gradient(45deg,#fbfaf7,#fbfaf7 10px,#f4f1ec 10px,#f4f1ec 20px);
}
#bgEmpty:hover{background:repeating-linear-gradient(45deg,#f8f6f1,#f8f6f1 10px,#efebe4 10px,#efebe4 20px)}

/* 좌측 순번 줄 — 칸은 항상 정사각형, 서로 딱 붙는다. 크기는 JS가 무대에 맞춰 잡는다 */
.slots{
  position:absolute;left:1.8%;top:1.6%;
  display:flex;flex-direction:column;justify-content:flex-start;
  align-items:flex-start;gap:0;z-index:3;
}
.slot{
  position:relative;flex:0 0 auto;
  width:56px;height:56px;
  background:#fff;border:3px solid #111;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font-weight:800;color:#111;line-height:1;
  box-shadow:0 1px 3px rgba(0,0,0,.22);
}
.slot.hot{border-color:var(--acc);box-shadow:0 0 0 4px rgba(154,124,46,.35)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}

/* 상단 캐릭터 카드 */
.pick{
  position:absolute;z-index:4;
  /* transform 대신 left 로 위치를 잡는다 — html2canvas 가 scale>1 에서
     translateX 걸린 요소의 내용을 밀어 그려 흰 여백이 생겼다 (2026-09-06) */
  left:42.2%;top:3%;
  width:26%;min-width:92px;max-width:190px;
  background:#fff;border:3px solid #111;border-radius:4px;
  box-shadow:0 3px 12px rgba(0,0,0,.3);
  cursor:grab;touch-action:none;user-select:none;
  overflow:hidden;
}
.pick:active{cursor:grabbing}
.pick.armed{border-color:var(--acc);box-shadow:0 0 0 4px rgba(154,124,46,.35),0 3px 12px rgba(0,0,0,.3)}
.pick img{display:block;width:100%;height:auto;pointer-events:none}

/* 끌기 중 따라다니는 유령 */
#ghost{
  position:fixed;z-index:999;pointer-events:none;
  width:90px;height:90px;border:3px solid var(--acc);border-radius:7px;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.35);background:#fff;
  transform:translate(-50%,-50%);opacity:.94;
}
#ghost img{display:block;width:100%;height:100%;object-fit:cover}

.statusbar{
  flex-shrink:0;background:var(--s1);border-top:1px solid var(--line);
  padding:6px 16px;font-size:11.5px;color:var(--t2);line-height:1.5;
}
.statusbar .note{color:var(--t3);font-size:11px}
.statusbar .note::before{content:'·';margin:0 7px;color:var(--line)}
.statusbar .note b{color:var(--t2);font-weight:600}

@media (max-width:560px){
  .topbar{padding:7px 8px;gap:5px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .topbar::-webkit-scrollbar{display:none}
  .topbar h1{display:none}
  .btn{padding:5px 8px;font-size:11px;line-height:16px;flex-shrink:0}
  .scroll{padding:10px 8px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <h1>FGO <span>순위 매기기</span></h1>
  <a class="btn" href="./" title="FGO 이것저것">Home</a>
  <button class="btn" onclick="pickFile()">배경 올리기</button>
  <input type="file" id="file" accept="image/*" hidden onchange="onFile(this.files[0]); this.value='';"/>
  <span class="seg" id="seg">
    <button class="btn on" data-g="0" onclick="setFilter(0)">모두</button>
    <button class="btn" data-g="1" onclick="setFilter(1)">남캐</button>
    <button class="btn" data-g="2" onclick="setFilter(2)">여캐</button>
  </span>
  <button class="btn save" id="btnPng" onclick="exportPNG()" style="margin-left:auto">PNG 저장</button>
</div>

<div class="scroll" id="scroll">
  <div id="stage">
    <div id="bgEmpty" onclick="pickFile()" role="button" tabindex="0">
      <div style="font-size:30px;line-height:1">🖼</div>
      <div>눌러서 배경 이미지 올리기</div>
      <div style="font-size:11px;color:var(--t3)">끌어다 놓기 · Ctrl+V 도 됩니다</div>
    </div>
    <img id="bgImg" alt="" hidden/>
    <div class="slots" id="slots"></div>
    <div class="pick" id="pick" hidden></div>
  </div>
</div>

<div class="statusbar"><span id="sb">준비</span><span class="note">남캐 · 여캐 기준은 <b>염마정이벤</b> 남탕 · 여탕 출격 기준.</span></div>

<script>
'use strict';

/* ═══ 상수 ═══ */
const N_SLOT = 10;
const FACE = id => `https://static.atlasacademy.io/JP/Faces/f_${id}0.png`;
const LS_BG = 'fgorank.bg';

/* ═══ 상태 ═══ */
let POOL = [];          // svt.json 전체
let queue = [];         // 이번 판 10기
let qi = 0;             // 지금 내밀고 있는 순번
let placed = new Array(N_SLOT).fill(null);
let filter = 0;          // 0=모두 1=남캐 2=여캐 (svt.json 7번째 칸 비트)

const $ = id => document.getElementById(id);
const sb = t => { $('sb').textContent = t; };

/* ═══ 시작 ═══ */
(async function init(){
  buildSlots();
  fit();
  restore();
  try {
    const r = await fetch('data/svt.json?v=2', {cache:'no-store'});
    POOL = await r.json();
  } catch(e) {
    sb('서번트 목록을 불러오지 못했습니다: ' + e.message);
    return;
  }
  roll();
})();

/* 랜덤 10기 (전체 풀에서, 중복 없음) */
function roll(){
  const a = POOL.filter(r => filter === 0 || ((r[6] || 0) & filter));
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  queue = a.slice(0, N_SLOT);
  qi = 0;
  placed = new Array(N_SLOT).fill(null);
  [...$('seg').children].forEach(b => { b.disabled = false; });
  renderSlots();
  renderPick();
  const label = filter === 1 ? '남캐' : filter === 2 ? '여캐' : '전체';
  sb(`${label} ${a.length}기(JP) 중 랜덤 ${N_SLOT}기. 순위로 드래그 하면 됩니다.`);
}

/* 필터 전환 — 배치를 시작하기 전에만 바꿀 수 있다 */
function setFilter(g){
  if (g === filter) return;
  if (placed.some(Boolean)) { sb('이미 배치를 시작해서 못 바꿉니다. 새로고침하세요.'); return; }
  filter = g;
  [...$('seg').children].forEach(b => b.classList.toggle('on', +b.dataset.g === g));
  roll();
}
function lockFilter(){
  [...$('seg').children].forEach(b => { b.disabled = true; });
}

/* ═══ 슬롯 ═══ */
function buildSlots(){
  const w = $('slots');
  w.innerHTML = '';
  for (let i = 0; i < N_SLOT; i++) {
    const d = document.createElement('div');
    d.className = 'slot';
    d.dataset.i = i;
    w.appendChild(d);
  }
}

/* 무대를 화면 안에 들어오게 줄이고, 칸을 정사각형으로 다시 잡는다 */
function fit(){
  const im = $('bgImg');
  const short = $('stage').classList.contains('short');
  const ratio = short ? 6/5
              : (!im.hidden && im.naturalWidth) ? im.naturalHeight / im.naturalWidth
              : 4/3;
  const wrap = $('scroll');
  const availW = Math.min(720, wrap.clientWidth - 28);
  const availH = wrap.clientHeight - 28;
  const w = Math.max(280, Math.min(availW, availH / ratio));
  $('stage').style.width = Math.floor(w) + 'px';
  layout();
}

function layout(){
  const st = $('stage').getBoundingClientRect();
  if (!st.width || !st.height) return;
  const size = Math.max(26, Math.min(st.width * 0.18, (st.height * 0.968) / N_SLOT));
  [...$('slots').children].forEach(el => {
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.fontSize = Math.round(size * 0.44) + 'px';
    el.style.borderWidth = (size < 46 ? 2 : 3) + 'px';
    el.style.borderRadius = Math.round(size * 0.12) + 'px';
  });
}
window.addEventListener('resize', fit);

function renderSlots(){
  [...$('slots').children].forEach((el, i) => {
    const s = placed[i];
    if (!s) { el.textContent = String(i + 1); el.removeAttribute('title'); return; }
    el.textContent = '';
    const img = document.createElement('img');
    img.crossOrigin = 'anonymous';   // src 대입 전에 걸어야 CORS 로 받는다
    img.src = FACE(s[0]);
    img.alt = '';
    el.appendChild(img);
  });
}

/* ═══ 지금 카드 ═══ */
function renderPick(){
  const p = $('pick');
  if (qi >= queue.length) {
    p.hidden = true;                 // 다 넣으면 카드 자체를 없앤다
    p.classList.remove('armed');
    p.innerHTML = '';
    sb('완료 ✓ 10명 다 넣었습니다. PNG로 저장하세요. (다시 하려면 새로고침)');
    return;
  }
  const s = queue[qi];
  p.hidden = false;
  p.innerHTML = '';
  const img = document.createElement('img');
  img.crossOrigin = 'anonymous';   // src 대입 전에 걸어야 CORS 로 받는다
  img.src = FACE(s[0]);
  img.alt = '';
  p.appendChild(img);
}

/* ═══ 배치 ═══ */
function place(slotIdx){
  if (qi >= queue.length) return false;
  if (slotIdx == null || slotIdx < 0 || slotIdx >= N_SLOT) return false;
  if (placed[slotIdx]) { sb(`${slotIdx + 1}번은 이미 찼습니다.`); return false; }
  if (!placed.some(Boolean)) lockFilter();
  placed[slotIdx] = queue[qi];
  qi++;
  renderSlots();
  renderPick();
  return true;
}

/* ═══ 끌기 (포인터 = 마우스·터치 공통) ═══ */
let dragging = false, ghost = null, armed = false;

$('pick').addEventListener('pointerdown', e => {
  if (qi >= queue.length) return;
  e.preventDefault();
  dragging = true;
  try { $('pick').setPointerCapture(e.pointerId); } catch(err) {}
  ghost = document.createElement('div');
  ghost.id = 'ghost';
  const im = document.createElement('img');
  im.src = FACE(queue[qi][0]);
  ghost.appendChild(im);
  document.body.appendChild(ghost);
  moveGhost(e.clientX, e.clientY);
});

$('pick').addEventListener('pointermove', e => {
  if (!dragging) return;
  moveGhost(e.clientX, e.clientY);
  hot(slotAt(e.clientX, e.clientY));
});

$('pick').addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  const el = slotAt(e.clientX, e.clientY);
  hot(null);
  if (ghost) { ghost.remove(); ghost = null; }
  if (el) {
    place(+el.dataset.i);
    armed = false; $('pick').classList.remove('armed');
  } else {
    // 안 옮겼으면 = 그냥 누른 것 → 찍어서 넣기 모드
    armed = !armed;
    $('pick').classList.toggle('armed', armed);
  }
});

$('pick').addEventListener('pointercancel', () => {
  dragging = false; hot(null);
  if (ghost) { ghost.remove(); ghost = null; }
});

/* 찍어서 넣기 */
$('slots').addEventListener('click', e => {
  const el = e.target.closest('.slot');
  if (!el || !armed) return;
  if (place(+el.dataset.i)) { armed = false; $('pick').classList.remove('armed'); }
});

function moveGhost(x, y){
  if (!ghost) return;
  ghost.style.left = x + 'px';
  ghost.style.top = y + 'px';
}
function slotAt(x, y){
  const el = document.elementFromPoint(x, y);
  const s = el && el.closest ? el.closest('.slot') : null;
  return (s && !placed[+s.dataset.i]) ? s : null;
}
let lastHot = null;
function hot(el){
  if (lastHot === el) return;
  if (lastHot) lastHot.classList.remove('hot');
  if (el) el.classList.add('hot');
  lastHot = el;
}

/* ═══ 배경 이미지 ═══ */
function pickFile(){ $('file').click(); }

function onFile(f){
  if (!f) return;
  if (!/^image\//.test(f.type)) { sb('이미지 파일만 됩니다.'); return; }
  const fr = new FileReader();
  fr.onload = () => setBg(fr.result, true);
  fr.onerror = () => sb('파일을 읽지 못했습니다.');
  fr.readAsDataURL(f);
}

function setBg(dataUrl, save){
  const img = $('bgImg');
  img.onload = () => {
    img.hidden = false;
    $('bgEmpty').hidden = true;
    // 세로로 충분히 길지 않으면 세로 액자에 넣는다 (10칸이 들어가야 함)
    $('stage').classList.toggle('short', img.naturalHeight / img.naturalWidth < 1.15);
    fit();
    if (save) shrinkAndStore(img);
    sb('이미지 적용됨.');
  };
  img.onerror = () => sb('이미지를 표시하지 못했습니다.');
  img.src = dataUrl;
}

/* localStorage에는 축소본만 넣는다 (용량 초과 방지) */
function shrinkAndStore(img){
  try {
    const MAX = 1400;
    const r = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * r);
    c.height = Math.round(img.naturalHeight * r);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    localStorage.setItem(LS_BG, c.toDataURL('image/jpeg', 0.9));
  } catch(e) { /* 저장 실패는 무시 */ }
}

function restore(){
  try {
    const b = localStorage.getItem(LS_BG);
    if (b) setBg(b, false);
  } catch(e) {}
}

/* 끌어다 놓기 */
const stage = $('stage');
['dragenter','dragover'].forEach(t => stage.addEventListener(t, e => {
  e.preventDefault(); stage.classList.add('drop-hot');
}));
['dragleave','drop'].forEach(t => stage.addEventListener(t, e => {
  e.preventDefault(); stage.classList.remove('drop-hot');
}));
stage.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) onFile(f);
});

/* 붙여넣기 */
window.addEventListener('paste', e => {
  const it = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
  if (it) onFile(it.getAsFile());
});

/* ═══ PNG 저장 ═══
   html2canvas 는 DOM 을 통째로 복제해 1초 이상 걸렸고 scale>1 에서 transform 을
   잘못 그렸다. 무대 구성이 (배경 1장 + 정사각 칸 11개)뿐이라 캔버스에 직접 그린다. */
function roundPath(g, x, y, w, h, r){
  if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, r); return; }
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function renderCanvas(){
  const st = $('stage'), sr = st.getBoundingClientRect();
  const im = $('bgImg');
  const hasBg = !im.hidden && im.naturalWidth > 0;
  const OW = Math.round(hasBg ? Math.min(1400, Math.max(900, im.naturalWidth)) : 1100);
  const k  = OW / sr.width;
  const OH = Math.round(sr.height * k);

  const cv = document.createElement('canvas');
  cv.width = OW; cv.height = OH;
  const g = cv.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, OW, OH);

  if (hasBg) {
    if (st.classList.contains('short')) {           // 가로 그림은 액자에 넣어 통째로
      g.fillStyle = '#20242b'; g.fillRect(0, 0, OW, OH);
      const s = Math.min(OW / im.naturalWidth, OH / im.naturalHeight);
      const w = im.naturalWidth * s, h = im.naturalHeight * s;
      g.drawImage(im, (OW - w) / 2, (OH - h) / 2, w, h);
    } else {
      g.drawImage(im, 0, 0, OW, OH);
    }
  }

  const drawBox = (el, isPick) => {
    if (el.hidden) return;
    const r = el.getBoundingClientRect();
    const X = (r.left - sr.left) * k, Y = (r.top - sr.top) * k;
    const W = r.width * k, H = r.height * k;
    const cs = getComputedStyle(el);
    const bw  = parseFloat(cs.borderTopWidth) * k;
    const rad = parseFloat(cs.borderTopLeftRadius) * k;

    roundPath(g, X, Y, W, H, rad); g.fillStyle = '#ffffff'; g.fill();

    const img = el.querySelector('img');
    if (img && img.naturalWidth) {
      g.save();
      roundPath(g, X + bw, Y + bw, W - 2*bw, H - 2*bw, Math.max(0, rad - bw));
      g.clip();
      const iw = W - 2*bw, ih = H - 2*bw;
      const s = Math.max(iw / img.naturalWidth, ih / img.naturalHeight);   // cover
      const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
      g.drawImage(img, X + bw + (iw - dw) / 2, Y + bw + (ih - dh) / 2, dw, dh);
      g.restore();
    } else if (!isPick) {
      g.fillStyle = '#111'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = `800 ${parseFloat(cs.fontSize) * k}px ${cs.fontFamily}`;
      g.fillText(el.textContent.trim(), X + W / 2, Y + H / 2);
    }

    roundPath(g, X + bw/2, Y + bw/2, W - bw, H - bw, Math.max(0, rad - bw/2));
    g.lineWidth = bw; g.strokeStyle = '#111'; g.stroke();
  };

  [...$('slots').children].forEach(el => drawBox(el, false));
  drawBox($('pick'), true);
  return cv;
}

function exportPNG(){
  sb('PNG 만드는 중…');
  const armedWas = armed;
  armed = false; $('pick').classList.remove('armed');   // 선택 테두리는 결과물에서 뺀다
  try {
    const cv = renderCanvas();
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const name = `FGO_순위_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.png`;
    // toBlob 은 같은 캔버스에서 toDataURL 보다 4배 느렸다 (1.1s vs 0.25s, 실측 2026-09-06)
    const a = document.createElement('a');
    a.download = name;
    a.href = cv.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
    sb('PNG 저장 완료 ✓');
  } catch(e) {
    sb('오류: ' + e.message);
  } finally {
    armed = armedWas;
    if (armed) $('pick').classList.add('armed');
  }
}

window.pickFile = pickFile;
window.setFilter = setFilter;
window.onFile = onFile;
window.exportPNG = exportPNG;
</script>
